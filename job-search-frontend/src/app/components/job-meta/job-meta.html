<div class="title-row">
  <div class="title" role="heading" [attr.aria-level]="level()">{{ job().job_title }}</div>

  <span class="item salary" title="Salary">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3v18M17 7.5c0-1.9-2.2-3-5-3s-5 1.1-5 3.3c0 4.7 10 2.5 10 7.4 0 2.2-2.2 3.3-5 3.3s-5-1.1-5-3" />
    </svg>
    <span class="sr-only">Salary:</span>
    {{ job().salary_range || 'N/A' }}
  </span>
</div>

<div class="item" title="Company">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 10h4a1 1 0 0 1 1 1v10M2 21h20M8 8h3M8 12h3M8 16h3" />
  </svg>
  <span class="sr-only">Company:</span>
  {{ job().company }}
</div>

<div class="item location" title="Location">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z" />
    <circle cx="12" cy="9" r="2.5" />
  </svg>
  <span class="sr-only">Location:</span>
  <span class="text">{{ job().location || 'N/A' }}</span>
</div>

<div class="item" title="Board">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="9" />
    <path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" />
  </svg>
  <span class="sr-only">Board:</span>
  {{ job().board_source || 'Unknown' }}
</div>
